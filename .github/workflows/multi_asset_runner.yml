name: Multi Asset SMC Scanner

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to save memory file back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Multi Asset SMC Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python smc_multi_scanner.py

      - name: Commit and Push State File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -f last_alerts.json ]; then
            git add last_alerts.json
            git commit -m "Update alert history cooldown [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No last_alerts.json file created yet. Skipping commit."
          fi
